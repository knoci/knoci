<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="knoci - Fresh Anime GitHub Profile Banner">
  <defs>
    <!-- Fresh Sky Blue to Sakura Pink Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="38%" stop-color="#7DD3FC"/>
      <stop offset="72%" stop-color="#E0C3FC"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>

    <!-- Soft Sun Glow -->
    <radialGradient id="sunGlow" cx="82%" cy="22%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#FFF1F2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary Soft Glow Left -->
    <radialGradient id="leftGlow" cx="18%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#FDF2F8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FDF2F8" stop-opacity="0"/>
    </radialGradient>

    <!-- Cloud Highlight & Shadow -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#F8FAFC" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.88"/>
    </linearGradient>

    <linearGradient id="cloudBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FCE7F3" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Sakura Petal Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="55%" stop-color="#FBCFE8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Glass Pill Fill -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Typography -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.28"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="roundedClip">
      <rect x="0" y="0" width="1200" height="320" rx="20" ry="20"/>
    </clipPath>

    <!-- Reusable Sakura Petal Shape -->
    <path id="sakuraPetal" d="M0,-9 C5,-8 8,-2 6,4 C4,8 1,9 0,7 C-1,9 -4,8 -6,4 C-8,-2 -5,-8 0,-9 Z" fill="url(#petalGrad)"/>

    <!-- Reusable 4-Point Anime Sparkle -->
    <path id="sparkle" d="M0,-10 Q1.5,-1.5 10,0 Q1.5,1.5 0,10 Q-1.5,1.5 -10,0 Q-1.5,-1.5 0,-10 Z" fill="#FFFFFF"/>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 56px;
      fill: #FFFFFF;
      letter-spacing: 1px;
    }
    .subtitle {
      font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #F8FAFC;
      letter-spacing: 1.2px;
    }
    .pill-text {
      font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans', system-ui, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #FFFFFF;
      letter-spacing: 1.5px;
    }
    .chip-text {
      font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #0369A1;
    }

    @keyframes driftSlow {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(18px); }
    }
    @keyframes driftReverse {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-14px); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.35; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes fall1 {
      0% { transform: translate(0px, -25px) rotate(0deg); opacity: 0; }
      12% { opacity: 0.92; }
      88% { opacity: 0.85; }
      100% { transform: translate(-110px, 345px) rotate(260deg); opacity: 0; }
    }
    @keyframes fall2 {
      0% { transform: translate(0px, -25px) rotate(35deg); opacity: 0; }
      15% { opacity: 0.88; }
      85% { opacity: 0.8; }
      100% { transform: translate(-140px, 345px) rotate(320deg); opacity: 0; }
    }
    @keyframes fall3 {
      0% { transform: translate(0px, -25px) rotate(-20deg); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.78; }
      100% { transform: translate(-90px, 345px) rotate(210deg); opacity: 0; }
    }

    .cloud-back { animation: driftSlow 18s ease-in-out infinite; }
    .cloud-front { animation: driftReverse 14s ease-in-out infinite; }
    .ai-orbit { animation: floatY 6s ease-in-out infinite; }
    .twinkle-1 { animation: twinkle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle-2 { animation: twinkle 4.1s ease-in-out 1.1s infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle-3 { animation: twinkle 3.6s ease-in-out 2.0s infinite; transform-box: fill-box; transform-origin: center; }

    .p1 { animation: fall1 9.5s linear infinite; }
    .p2 { animation: fall2 11.2s linear 1.8s infinite; }
    .p3 { animation: fall3 8.8s linear 3.4s infinite; }
    .p4 { animation: fall1 12.0s linear 5.0s infinite; }
    .p5 { animation: fall2 10.4s linear 6.5s infinite; }
    .p6 { animation: fall3 9.2s linear 0.7s infinite; }
    .p7 { animation: fall1 11.5s linear 4.1s infinite; }
    .p8 { animation: fall2 9.8s linear 2.6s infinite; }
  </style>

  <g clip-path="url(#roundedClip)">
    <!-- Sky Background -->
    <rect width="1200" height="320" fill="url(#skyGrad)"/>
    <rect width="1200" height="320" fill="url(#sunGlow)"/>
    <rect width="1200" height="320" fill="url(#leftGlow)"/>

    <!-- Subtle Anime Diagonal Light Rays -->
    <g opacity="0.16">
      <polygon points="820,0 960,0 640,320 510,320" fill="#FFFFFF"/>
      <polygon points="1010,0 1110,0 820,320 735,320" fill="#FFFFFF"/>
    </g>

    <!-- Soft Bokeh Orbs -->
    <circle cx="965" cy="72" r="46" fill="#FFFFFF" opacity="0.22"/>
    <circle cx="1055" cy="128" r="24" fill="#FCE7F3" opacity="0.34"/>
    <circle cx="845" cy="148" r="16" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="1120" cy="64" r="14" fill="#FFFFFF" opacity="0.3"/>

    <!-- Background Anime Cumulus Clouds -->
    <g class="cloud-back">
      <path d="M-40,320 L-40,255 Q20,220 78,242 Q120,198 188,218 Q245,190 305,228 Q355,220 398,255 L398,320 Z" fill="url(#cloudBackGrad)"/>
      <path d="M740,320 L740,248 Q790,192 868,205 Q925,142 1018,162 Q1082,126 1152,165 Q1185,158 1240,188 L1240,320 Z" fill="url(#cloudBackGrad)"/>
    </g>

    <!-- Stylized AI / Agent Constellation Graphic (Right Side) -->
    <g class="ai-orbit" opacity="0.92">
      <!-- Outer soft dashed halo -->
      <circle cx="985" cy="145" r="78" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-dasharray="5 7" opacity="0.55"/>
      <circle cx="985" cy="145" r="52" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>

      <!-- Neural / Agent Connection Lines -->
      <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.75">
        <line x1="985" y1="145" x2="928" y2="98"/>
        <line x1="985" y1="145" x2="1050" y2="106"/>
        <line x1="985" y1="145" x2="1046" y2="188"/>
        <line x1="985" y1="145" x2="920" y2="182"/>
        <line x1="928" y1="98" x2="1050" y2="106" opacity="0.45"/>
        <line x1="1050" y1="106" x2="1046" y2="188" opacity="0.45"/>
      </g>

      <!-- Nodes -->
      <circle cx="928" cy="98" r="6" fill="#FFFFFF" filter="url(#softGlow)"/>
      <circle cx="1050" cy="106" r="7" fill="#FBCFE8" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="1046" cy="188" r="5.5" fill="#FFFFFF" filter="url(#softGlow)"/>
      <circle cx="920" cy="182" r="6" fill="#BAE6FD" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Center Anime Star Core -->
      <circle cx="985" cy="145" r="18" fill="#FFFFFF" fill-opacity="0.28"/>
      <g transform="translate(985, 145) scale(1.45)">
        <use href="#sparkle" filter="url(#softGlow)"/>
      </g>
    </g>

    <!-- Foreground Crisp Anime Clouds -->
    <g class="cloud-front">
      <path d="M-30,320 L-30,278 Q35,248 92,272 Q145,240 205,268 Q265,258 318,288 Q380,276 440,300 Q510,286 585,306 Q665,288 745,304 Q825,260 905,274 Q968,228 1048,246 Q1115,212 1185,242 L1240,256 L1240,320 Z" fill="url(#cloudGrad)"/>
    </g>

    <!-- Twinkling Anime Sparkles -->
    <g transform="translate(610, 78) scale(0.85)"><use href="#sparkle" class="twinkle-1" filter="url(#softGlow)"/></g>
    <g transform="translate(790, 62) scale(0.65)"><use href="#sparkle" class="twinkle-2" filter="url(#softGlow)"/></g>
    <g transform="translate(865, 215) scale(0.7)"><use href="#sparkle" class="twinkle-3" filter="url(#softGlow)"/></g>
    <g transform="translate(1118, 168) scale(0.75)"><use href="#sparkle" class="twinkle-1" filter="url(#softGlow)"/></g>

    <!-- Left-Center Clean Typography Block -->
    <g transform="translate(76, 62)">
      <!-- Welcome Pill -->
      <rect x="0" y="0" width="292" height="30" rx="15" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1"/>
      <text x="146" y="20" text-anchor="middle" class="pill-text">✦  WELCOME TO MY SPACE  ✦</text>

      <!-- Main Name -->
      <text x="0" y="102" class="title" filter="url(#textShadow)">Hi, I'm knoci</text>

      <!-- Subtitle -->
      <text x="2" y="142" class="subtitle" filter="url(#textShadow)">Backend &amp; AI Agent Developer  ·  Exploring LLMs &amp; Code</text>

      <!-- Mini Pastel Feature Chips -->
      <g transform="translate(0, 166)">
        <rect x="0" y="0" width="76" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
        <text x="38" y="19" text-anchor="middle" class="chip-text">Go</text>

        <rect x="88" y="0" width="92" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
        <text x="134" y="19" text-anchor="middle" class="chip-text">Python</text>

        <rect x="192" y="0" width="112" height="28" rx="14" fill="#FDF2F8" fill-opacity="0.94" stroke="#F9A8D4" stroke-width="1"/>
        <text x="248" y="19" text-anchor="middle" class="chip-text" style="fill:#BE185D;">AI · Agent</text>

        <rect x="316" y="0" width="96" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
        <text x="364" y="19" text-anchor="middle" class="chip-text">ACG ✦</text>
      </g>
    </g>

    <!-- Drifting Sakura Petals -->
    <g>
      <g transform="translate(280, 0)"><g class="p1"><use href="#sakuraPetal" transform="scale(0.9)"/></g></g>
      <g transform="translate(490, 0)"><g class="p2"><use href="#sakuraPetal" transform="scale(0.75)"/></g></g>
      <g transform="translate(670, 0)"><g class="p3"><use href="#sakuraPetal" transform="scale(1.0)"/></g></g>
      <g transform="translate(840, 0)"><g class="p4"><use href="#sakuraPetal" transform="scale(0.8)"/></g></g>
      <g transform="translate(1020, 0)"><g class="p5"><use href="#sakuraPetal" transform="scale(0.95)"/></g></g>
      <g transform="translate(1140, 0)"><g class="p6"><use href="#sakuraPetal" transform="scale(0.7)"/></g></g>
      <g transform="translate(390, 0)"><g class="p7"><use href="#sakuraPetal" transform="scale(0.65)"/></g></g>
      <g transform="translate(930, 0)"><g class="p8"><use href="#sakuraPetal" transform="scale(0.85)"/></g></g>
    </g>

    <!-- Crisp Inner Frame Border -->
    <rect x="1" y="1" width="1198" height="318" rx="19" ry="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
  </g>
</svg>
